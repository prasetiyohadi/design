<!-- @dsCard group="Components" viewport="700x360" subtitle="Buttons, tags, code block" name="Core primitives" -->
<html><head><link rel="stylesheet" href="../../styles.css"><style>
body{background:var(--bg);padding:24px;color:var(--text-primary)}
.row{display:flex;gap:10px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
.btn{font-family:var(--font-heading);font-weight:600;border-radius:var(--radius-sm);border:1px solid transparent;padding:10px 18px;font-size:var(--text-sm);text-decoration:none;display:inline-flex}
.btn-primary{background:var(--accent);color:var(--text-on-accent)}
.btn-secondary{background:transparent;color:var(--text-primary);border-color:var(--border-strong)}
.btn-ghost{background:transparent;color:var(--accent)}
.tag{font-family:var(--font-mono);font-size:var(--text-xs);padding:3px 10px;border-radius:var(--radius-full);border:1px solid var(--border-strong);color:var(--text-secondary)}
.tag.active{border-color:var(--accent-border);background:var(--accent-dim);color:var(--accent)}
pre{background:var(--code-bg);border:1px solid var(--code-border);border-radius:var(--radius-md);margin:0;padding:16px 18px;font-family:var(--font-mono);font-size:var(--text-sm);color:var(--code-fg);overflow:auto}
</style></head><body>
<div class="row">
  <a class="btn btn-primary">Read the postmortem</a>
  <a class="btn btn-secondary">Secondary</a>
  <a class="btn btn-ghost">Ghost →</a>
</div>
<div class="row">
  <span class="tag">kubernetes</span>
  <span class="tag active">gitops</span>
  <span class="tag">networking</span>
  <span class="tag">platform-engineering</span>
</div>
<pre><span style="color:var(--code-comment)"># apply.sh</span>
kubectl <span style="color:var(--code-tag)">--context</span>=prod-apse1 apply -f ./manifests</pre>
</body></html>
