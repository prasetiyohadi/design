<!-- @dsCard group="Spacing" viewport="700x180" subtitle="Corner radii + elevation" name="Radius & shadow" -->
<html><head><link rel="stylesheet" href="../styles.css"><style>
body{background:var(--bg);padding:24px;display:flex;gap:16px;font-family:var(--font-mono);font-size:var(--text-xs);color:var(--text-secondary)}
.box{width:110px;height:90px;background:var(--surface);border:1px solid var(--border-hairline);display:flex;align-items:flex-end;padding:8px}
</style></head><body>
<div class="box" style="border-radius:var(--radius-sm)">sm 4px</div>
<div class="box" style="border-radius:var(--radius-md)">md 8px</div>
<div class="box" style="border-radius:var(--radius-lg)">lg 12px</div>
<div class="box" style="border-radius:var(--radius-md);box-shadow:var(--shadow-md);border:none">shadow-md</div>
</body></html>
