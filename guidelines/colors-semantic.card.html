<!-- @dsCard group="Colors" viewport="700x160" subtitle="Status colors" name="Semantic colors" -->
<html><head><link rel="stylesheet" href="../styles.css"><style>
body{background:var(--bg);padding:24px;font-family:var(--font-mono);font-size:var(--text-xs)}
.row{display:flex;gap:12px}
.sw{flex:1;height:80px;border-radius:var(--radius-sm);display:flex;align-items:flex-end;padding:8px;color:var(--text-on-accent)}
</style></head><body>
<div class="row">
  <div class="sw" style="background:var(--success);color:#0B1210">--success</div>
  <div class="sw" style="background:var(--warning);color:#0B1210">--warning</div>
  <div class="sw" style="background:var(--danger);color:#0B1210">--danger</div>
  <div class="sw" style="background:var(--link);color:#0B1210">--link</div>
</div>
</body></html>
