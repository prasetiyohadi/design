<html><head><link rel="stylesheet" href="../styles.css"><style>

.bar{height:36px;background:var(--surface);border:1px dashed var(--border-strong);border-radius:var(--radius-sm);display:flex;align-items:center;padding:0 12px;margin-bottom:12px}
</style></head><body>
<div class="bar" style="width:var(--content-width)">--content-width: 700px (prose)</div>
<div class="bar" style="width:min(100%,var(--content-width-wide))">--content-width-wide: 1040px (diagrams, tables)</div>
</body></html>
